name: Deploy to GitHub Pages and VPS

on:
  push:
    branches: 'master'

jobs:
  build-client:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Configuration ⚙️
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies 🔧
        run: pnpm i --frozen-lockfile

      - name: Build 🏗️
        env:
          PUBLIC_ADAPTER: static
          PUBLIC_API_URL: ${{ vars.API_URL }}
          PUBLIC_GTAG_ID: ${{ vars.GTAG_ID }}
          PUBLIC_BASE_URL: ${{ vars.BASE_URL }}
          PUBLIC_CAPTCHA: ${{ vars.PUBLIC_CAPTCHA }}
          PRIVATE_GROUP_ID:
          PRIVATE_THREAD_ID:
          PRIVATE_BOT_KEY:
          PRIVATE_CAPTCHA:
        run: |
          pnpm build

      - name: Upload Artifacts 🚀
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  build-server:
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    env:
      IMAGE: ${{ secrets.REGISTRY_URL }}/${{ vars.SERVICE }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Docker Buildx ⚓
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to the Registry 🔑
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Container 🏗️
        id: build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          build-args: |
            PRIVATE_GROUP_ID=${{ secrets.PRIVATE_GROUP_ID }}
            PRIVATE_THREAD_ID=${{ secrets.PRIVATE_THREAD_ID }}
            PRIVATE_BOT_KEY=${{ secrets.PRIVATE_BOT_KEY }}
            PRIVATE_CAPTCHA=${{ secrets.PRIVATE_CAPTCHA }}
            PUBLIC_API_URL=${{ vars.API_URL }}
            PUBLIC_GTAG_ID=${{ vars.GTAG_ID }}
            PUBLIC_BASE_URL=${{ vars.BASE_URL }}
            PUBLIC_CAPTCHA=${{ vars.PUBLIC_CAPTCHA }}

      - name: Save Image Digest
        run: |
          echo "${{ steps.build.outputs.digest }}" > image-digest.txt

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt

  deploy:
    needs:
      - build-client
      - build-server

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Download Digest Artifact
        uses: actions/download-artifact@v4
        with:
          name: image-digest

      - name: Read Digest
        id: digest
        run: |
          DIGEST=$(cat image-digest.txt)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy Client 🚀
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Server 🚀
        run: |-
          sed -i "s|\${REGISTRY_URL}|${{ secrets.REGISTRY_URL }}|g" compose.yml
          sed -i "s|${{ vars.SERVICE }}:latest|${{ vars.SERVICE }}@${{ steps.digest.outputs.digest }}|g" compose.yml

          curl ${{ secrets.CD_URL }}/${{ vars.SERVICE }} -H 'authorization: ${{ secrets.CD_AUTHORIZATION }}' -F compose=@compose.yml
